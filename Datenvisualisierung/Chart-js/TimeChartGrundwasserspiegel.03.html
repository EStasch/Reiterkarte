<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js Zeitachse Beispiel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .chart-container { position: relative; height: auto; width: 90vw; margin: 0 auto; }
        #timeChart { width: 90%; height: auto; }
    </style>
</head>
<body>

    <h2>Grundwasser Messwerte Bad Urach</h2>
    <div class="chart-container">
        <canvas id="timeChart"></canvas>
    </div>

    <!-- 1. Chart.js Core Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- 2. Date-fns (Die Zeit-Bibliothek) -->
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/dist/date-fns.min.js"></script>
    <!-- 3. Chart.js Adapter für date-fns (Zwingend erforderlich!) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- 4. Chart.js Trendline Plugin (Optional, falls Trendlinien benötigt werden) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-trendline/dist/chartjs-plugin-trendline.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.0/dist/chartjs-plugin-zoom.min.js"></script>
    <!-- 5. Eigene Skripte -->
    <script src="js/plugins-types.js"></script>
    <script src="js/fetchData.js"></script>
    <script src="js/analyse.js"></script>

    <script>
        // Daten vorbereiten: Array von Objekten mit 'x' (Zeit) und 'y' (Wert)
        // Die Zeit kann als ISO-String oder Date-Objekt übergeben werden.
        //parse('01/01/2023', 'dd/MM/yyyy', new Date())

       
        /* Testdaten für die Darstellung */
        /*
        const chartData = [
            { x: new Date('01.01.2023'), y: 12 },
            { x: new Date('02.01.2023'), y: 19 },
            { x: new Date('03.01.2023'), y: 15 },
            { x: new Date('04.01.2023'), y: 25 },
            { x: new Date('05.01.2023'), y: 22 },
            { x: new Date('06.01.2023'), y: 30 },
            { x: new Date('07.01.2023'), y: 28 }
        ];

        const chartData1 = [
            { x: parseDateString('01.01.2023'), y: 120 },
            { x: parseDateString('02.01.2023'), y: 190 },
            { x: parseDateString('03.01.2023'), y: 150 },
            { x: parseDateString('04.01.2023'), y: 250 },
            { x: parseDateString('05.01.2023'), y: 220 },
            { x: parseDateString('06.01.2023'), y: 300 },
            { x: parseDateString('07.01.2023'), y: 280 }
        ];
        */


        const MesswerteUrl = './data/Bad Urach_Messwerte-Grundwassermenge_Messwert _Einzelwerte_ 2026-08-11.json';
        const MittelwerteUrl = './data/Bad Urach_Messwerte-Grundwassermenge_Messwert _Mittelwerte_ 2026-08-11.json';

        const ctx = document.getElementById('timeChart').getContext('2d');

        // Calling the async function
        fetchData(MesswerteUrl).then(json_Messwerte => {
            //Aufbereitung der Messwerte für die Darstellung
            //console.log("Messwerte:", json_Messwerte);

            const data_Messwerte = json_Messwerte.map(item => ({
                x: parseDateString(item.Messzeitpunkt), // Assuming the date format is 'dd.MM.yyyy' (de)
                y: parseInt(item.Messwert)
            }));
            //console.log("data_Messwerte:", data_Messwerte);

            fetchData(MittelwerteUrl).then(json_Mittelwerte => {
                // Now you can use both json_Messwerte and json_Mittelwerte here
                //Aufbereitung der Mittelwerte für die Darstellung
                
                //console.log("Mittelwerte:", json_Mittelwerte);
                
                json_Mittelwerte = json_Mittelwerte.filter(item => item.Jahr !== "Gesamtergebnis");
                json_Gesamtergebnis = json_Mittelwerte.find(item => item.Jahr === "Gesamtergebnis");

                const data_Mittelwerte = json_Mittelwerte.map(item => ({
                    x: makeDateString(item.Jahr), // Assuming the year is in 'yyyy' format
                    y: parseInt(item.MittelwertvonMesswert)
                }));

                //console.log("data_Mittelwerte:", data_Mittelwerte);

                //Trendlinie berechnen (z.B. gleitender Durchschnitt)
                //Trendlinie für die Messwerte berechnen (z.B. gleitender Durchschnitt EMA)
                const trendlineData_EMA_3 = calculateEMA(data_Messwerte.map(d => d.y), 3); // 3-Perioden EMA
                const trendlineDataFormatted_EMA_3 = data_Messwerte.map((d, i) => ({
                    x: d.x,
                    y: trendlineData_EMA_3[i] !== undefined ? trendlineData_EMA_3[i] : null
                }));
                
                

                // Chart.js Konfiguration und Darstellung
                    new Chart(ctx, {
                        plugins: [simplePlugin],
                        type: 'line',
                        data: {
                            // Bei Zeitachsen oft leer lassen, da die Labels aus den Dataset 'x' Werten kommen
                            labels: [], 
                            datasets: [                           
                            {
                                label: 'Messwerte',
                                data: data_Messwerte,
                                borderColor: 'rgba(75, 192, 192, 1)', //rgba(75, 192, 192, 1)
                                backgroundColor: 'rgba(75, 192, 192, 0.2)', //rgba(75, 192, 192, 0.2)
                                tension: 0.1, // Macht die Linie leicht geschwungen
                                fill: false,
                                hidden: true,  // Initial ausgeblendet
                                order: 1 // Höherer Wert -> wird später gezeichnet (vorne)
                            },
                            {
                                label: 'gleitender Durchschnitt EMA 3',
                                data: trendlineDataFormatted_EMA_3,
                                borderColor: 'rgba(53,83,153,0.5)',
                                backgroundColor: 'rgba(191,216,235,1)', //rgba(95,158,205,0.5)
                                tension: 0.1,
                                fill: false,
                                order: 2
                            },
                            {
                                label: 'Jahresdurchschnitt',
                                data: data_Mittelwerte,
                                borderColor: 'rgb(255, 99, 132,0.7)', //rgba(242,189,70,1)
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                tension: 0.2,
                                fill: false,
                                order: 3,
                                tooltip: {
                                    intersect: true,
                                    callbacks: {
                                        label: function(context) {
                                            return 'Jahresdurchschnitt: ' + context.parsed.y;
                                        }
                                    }
                                }
                            },                            
                            {
                                data: data_Messwerte,
                                label: 'Messwerte',
                                borderColor: 'rgba(53,83,153,0)',
                                backgroundColor: 'rgba(95,158,205,0)',
                                pointRadius: 0, // Punkte auf der Trendlinie ausblenden                             
                                fill: false,
                                order: 4,
                                trendlineLinear: {
                                    colorMin: 'rgba(242,187,67,1)',
                                    colorMax: 'rgba(242,187,67,0.5)',
                                    lineStyle: 'dashed',
                                    width: 4,
                                    label: {
                                        font: {
                                            size: 14,
                                        },
                                        color: 'rgba(242,187,67,1)',
                                        text: 'Trend',
                                        displayValue: false,
                                        offset: 10,
                                    },
                                    legend: {
                                        color: 'rgba(242,187,67,1)',
                                        text: 'Grundwasserspiegel trendline',
                                        display: true,
                                        lineDash: [8, 3],
                                    },
                                },
                            },                           
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            scales: {
                                x: {
                                    type: 'time', // WICHTIG: Achsentyp auf 'time' setzen
                                    time: {
                                        unit: 'year', // Unterteilung der Achse (auto, second, minute, hour, day, week, month)
                                        displayFormats: {
                                            day: 'dd.MM.yyyy', // Format für die Achsenbeschriftung
                                            hour: 'dd.MMM HH:mm',
                                            year: 'yyyy' // Anzeigeformat: z.B. "2020"
                                        },
                                        tooltipFormat: 'dd. MMMM yyyy, HH:mm' // Format im Tooltip beim Hover
                                    },
                                    title: {
                                        display: false,
                                        text: 'Datum'
                                    }
                                },
                                y: {
                                    beginAtZero: false,
                                    title: {
                                        display: true,
                                        text: 'Messwert'
                                    }
                                }
                            },
                            plugins: {
                                /*
                                tooltip: {
                                    mode: 'index',
                                    intersect: false,
                                },
                                */
                                tooltip: {
                                    mode: 'index',
                                    intersect: false,
                                    callbacks: {
                                        title: function(context) {
                                            // Holt das formatierte Datum und fügt Text hinzu
                                            const dateLabel = context[0].label; 
                                            return dateLabel + ' Uhr';
                                        }
                                    }
                                },
                                zoom: {
                                    pan: {
                                        enabled: true,
                                        mode: 'xy',
                                        modifierKey: 'ctrl', // Nur mit gedrückter Strg-Taste verschieben
                                    },
                                    zoom: {
                                        wheel: {
                                            enabled: true,
                                        },
                                        pinch: {
                                            enabled: true
                                        },
                                        mode: 'xy',
                                    }                                        
                                },
                                        
                            },
                            elements: {
                                point: {
                                    radius: 3,
                                    backgroundColor: "rgba(211, 211, 237, 1.0)",
                                    borderColor: "rgba(0,0,255,1.0)",
                                    borderWidth: 1,
                                    pointHoverRadius: 10
                                },
                                line: {
                                    backgroundColor: "rgba(0,0,255,1.0)",
                                    borderColor: "rgba(211, 211, 237, 1.0)",
                                    borderWidth: 3
                                }
                            }
                        }
                    });
            });
        });
    </script>
</body>
</html>
