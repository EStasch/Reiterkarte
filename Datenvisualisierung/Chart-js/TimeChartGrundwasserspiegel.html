<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js Zeitachse Beispiel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .chart-container { position: relative; height: auto; width: 90vw; margin: 0 auto; }
        #timeChart { width: 90%; height: auto; }
    </style>
</head>
<body>

    <h2>Zeitdaten auf der X-Achse (Chart.js 4.x)</h2>
    <div class="chart-container">
        <canvas id="timeChart"></canvas>
    </div>

    <!-- 1. Chart.js Core Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- 2. Date-fns (Die Zeit-Bibliothek) -->
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/dist/date-fns.min.js"></script>
    <!-- 3. Chart.js Adapter für date-fns (Zwingend erforderlich!) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- 4. Eigene Skripte -->
    <script src="js/plugins-types.js"></script>
    <script src="js/fetchData.js"></script>
    <!-- Load Luxon from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.2.1/build/global/luxon.min.js"></script>

    <script>
        // Daten vorbereiten: Array von Objekten mit 'x' (Zeit) und 'y' (Wert)
        // Die Zeit kann als ISO-String oder Date-Objekt übergeben werden.
        //parse('01/01/2023', 'dd/MM/yyyy', new Date())

        function parseDateString(dateString) {
            // Assuming the date format is 'dd.MM.yyyy'
            const [day, month, year] = dateString.split('.');
            return new Date(`${year}-${month}-${day}`);
        }

        function formatDateToISO(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        formatDateToISO(parseDateString('01.01.2023')); // Returns '2023-01-01'


        const chartData = [
            { x: new Date('01.01.2023'), y: 12 },
            { x: new Date('02.01.2023'), y: 19 },
            { x: new Date('03.01.2023'), y: 15 },
            { x: new Date('04.01.2023'), y: 25 },
            { x: new Date('05.01.2023'), y: 22 },
            { x: new Date('06.01.2023'), y: 30 },
            { x: new Date('07.01.2023'), y: 28 }
        ];

        const chartData1 = [
            { x: parseDateString('01.01.2023'), y: 120 },
            { x: parseDateString('02.01.2023'), y: 190 },
            { x: parseDateString('03.01.2023'), y: 150 },
            { x: parseDateString('04.01.2023'), y: 250 },
            { x: parseDateString('05.01.2023'), y: 220 },
            { x: parseDateString('06.01.2023'), y: 300 },
            { x: parseDateString('07.01.2023'), y: 280 }
        ];

        // Access DateTime from the global luxon object
        const DateTime = luxon.DateTime;

        const chartData2 = [
            { x: (DateTime.fromFormat('01.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 12 },
            { x: (DateTime.fromFormat('02.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 19 },
            { x: (DateTime.fromFormat('03.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 15 },
            { x: (DateTime.fromFormat('04.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 25 },
            { x: (DateTime.fromFormat('05.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 22 },
            { x: (DateTime.fromFormat('06.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 30 },
            { x: (DateTime.fromFormat('07.01.2023', 'dd.MM.yyyy', {locale: 'de'}).toISO()), y: 28 }
        ];

        //DateTime.fromISO("2016-05-25");
        // DateTime.fromFormat("01.01.2023", "dd.mm.yyyy");
        // DateTime.fromFormat("May 25 1982", "LLLL dd yyyy");


        const MesswerteUrl = './data/Bad Urach_Messwerte-Grundwassermenge_Messwert _Einzelwerte_ 2026-08-11.json';
        const MittelwerteUrl = './data/Bad Urach_Messwerte-Grundwassermenge_Messwert _Mittelwerte_ 2026-08-11.json';

        const ctx = document.getElementById('timeChart').getContext('2d');

        // Calling the async function
        fetchData(MesswerteUrl).then(json_Messwerte => {
            console.log("Messwerte:", json_Messwerte);

            
            
            const data_Messwerte = json_Messwerte.map(item => ({
                x: parseDateString(item.Messzeitpunkt), // Assuming Messzeitpunkt is in a format that can be parsed by Date
                y: parseInt(item.Messwert)
            }));
            console.log("data_Messwerte:", data_Messwerte);

            fetchData(MittelwerteUrl).then(json_Mittelwerte => {
                console.log("Mittelwerte:", json_Mittelwerte);
                // Now you can use both json_Messwerte and json_Mittelwerte here

                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            // Bei Zeitachsen oft leer lassen, da die Labels aus den Dataset 'x' Werten kommen
                            labels: [], 
                            datasets: [{
                                label: 'Grundwasserstand',
                                data: data_Messwerte,
                                borderColor: 'rgb(75, 192, 192)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                tension: 0.1, // Macht die Linie leicht geschwungen
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            scales: {
                                x: {
                                    type: 'time', // WICHTIG: Achsentyp auf 'time' setzen
                                    time: {
                                        unit: 'month', // Unterteilung der Achse (auto, second, minute, hour, day, week, month)
                                        displayFormats: {
                                            day: 'dd.MM.yyyy', // Format für die Achsenbeschriftung
                                            hour: 'dd.MMM HH:mm'
                                        },
                                        tooltipFormat: 'dd. MMMM yyyy, HH:mm' // Format im Tooltip beim Hover
                                    },
                                    title: {
                                        display: true,
                                        text: 'Datum'
                                    }
                                },
                                y: {
                                    beginAtZero: false,
                                    title: {
                                        display: true,
                                        text: 'Messwert'
                                    }
                                }
                            },
                            plugins: {
                                tooltip: {
                                    mode: 'index',
                                    intersect: false,
                                }
                            }
                        }
                    });
            });
        });
    </script>
</body>
</html>
