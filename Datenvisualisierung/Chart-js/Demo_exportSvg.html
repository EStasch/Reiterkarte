<!DOCTYPE html>
<html>
<!--script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script-->

<!--  modified file is removed e.resetTransform() for chartjs version 4.4.1 -->
<script src="https://reinventatuweb.cl/otros/chart-4-4-1-m.min.js"></script>

<!-- Export Chart to svg and png -->   
    <script src="https://gliffy.github.io/canvas2svg/canvas2svg.js"></script>
    
<!-- 5. Eigene Skripte -->
    <script src="js/export_svg.js"></script>

<style>
    body {
        background-color: #f1f1f1;
        margin: 0;
        padding: 2em;
        font-family: Arial, sans-serif;
    }
    #myChart1,#myChart2{
      width:100%;
      max-width:600px;
    }
    .chart-container {
        position: relative;
    margin: 2em auto;
    margin-left: 2em;
    width: 80vw;
    }
</style>
<body>

  <h1>Grundwasserspiegel Bad Urach</h1>
  <div class="chart-container">
    <canvas id="myChart1"></canvas>
    <canvas id="myChart2"></canvas>
  </div>

<script>
const xValues = [50,60,70,80,90,100,110,120,130,140,150];
const yValues = [7,8,8,9,9,9,10,11,14,14,15];

Chart.defaults.backgroundColor = "rgba(0,0,255,0.1)";
Chart.defaults.borderColor = "rgba(0,0,255,1.0)";

var ctx = document.getElementById('myChart1');
ctx.width = 600;
ctx.height = 400;

var myChart1 = new Chart(ctx, {
  type: "line",
  data: {
    labels: xValues,
    datasets: [{
      label: 'Dataset 1',
      fill: false,
      lineTension: 0,
      data: yValues
    }]
  },
  options: {
    //responsive: true,
    responsive: false, //set for svgExport
    animation:{duration:0}, //set for svgExport
    legend: {
        display: true,
        position: 'top'
      },
    title: {
        display: true,
        text: 'Chart.js Line Chart'
      },
    scales: {
      y: {
        beginAtZero: false
      },
    },
    elements: {
      point: {
        radius: 5,
        backgroundColor: "rgba(211, 211, 237, 1.0)",
        borderColor: "rgba(0,0,255,1.0)",
        borderWidth: 2,
        pointHoverRadius: 15
      },
      line: {
        backgroundColor: "rgba(0,0,255,1.0)",
        borderColor: "rgba(211, 211, 237, 1.0)",
        borderWidth: 4
      }
    }
  }
});

// Svg export
createSvgLink('chart.svg', 'Download SVG', myChart1, "chart-container");

</script>

</body>
</html>
