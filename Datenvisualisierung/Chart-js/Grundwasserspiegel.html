const MesswerteUrl = './data/Bad Urach_Messwerte-Grundwassermenge_Messwert _Einzelwerte_ 2026-08-11.json';
const MittelwerteUrl = './data/Bad Urach_Messwerte-Grundwassermenge_Messwert _Mittelwerte_ 2026-08-11.json';


//const json_Messwerte = await fetchData(MesswerteUrl);

Chart.defaults.backgroundColor = "rgba(0,0,255,0.1)";
Chart.defaults.borderColor = "rgba(0,0,255,1.0)";

// Calling the async function
fetchData(MesswerteUrl).then(json_Messwerte => {
  console.log(json_Messwerte);
  
  const data_Messwerte = json_Messwerte.map(item => ({
    x: new Date(item.Messzeitpunkt), // Assuming Messzeitpunkt is in a format that can be parsed by Date
    y: item.Messwert
  }));

  fetchData(MittelwerteUrl).then(json_Mittelwerte => {
    console.log(json_Mittelwerte);
    // Now you can use both json_Messwerte and json_Mittelwerte here

    new Chart("myChart1", {
        plugins: [simplePlugin],
        type: "line",
        data: {
          labels: [],
          datasets: [{
            label: 'Messwerte Grundwasserspiegel Bad Urach',
            fill: false,
            lineTension: 0,
            data: data_Messwerte
          }]
        },
        options: {
          responsive: true,
          legend: {
              display: true,
              position: 'top'
            },
          title: {
              display: true,
              text: 'Chart.js Line Chart'
            },
          /*

          scales: {
              x: {
                  type: 'time', // Wichtig: Typ auf 'time' setzen

                      unit: 'year', // Automatische Gruppierung nach Tagen
                      displayFormats: {
                          day: 'dd.MM.yyyy' // Deutsches Datumsformat

                      tooltipFormat: 'dd.MM.yyyy HH:mm'
                  },
                  title: {

                  }
              },
              y: {

              }

              borderWidth: 4
            }
          }
        }
      });
