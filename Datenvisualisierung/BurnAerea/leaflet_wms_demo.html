<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Leaflet WMS Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 400px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Karte initialisieren
        var map = L.map('map').setView([39.87, -105.045], 5);

        // 2. Basemap (OpenStreetMap) hinzufügen
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 3. WMS-Schicht hinzufügen (Beispiel: Wetterdaten)
        var wmsLayer = L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi', {
            layers: 'nexrad-n0r-900913',
            format: 'image/png',
            transparent: true,
            opacity: 0.7,
            attribution: 'Weather data &copy; IEM Nexrad'
        }).addTo(map);
    </script>
</body>
</html>
