<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre – GPX + Tracking + Heading</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <!--
  <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" rel="stylesheet" />
  -->
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .hud {
      position: absolute; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.7); color: #fff; padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.6;
    }
    .hud b { color: #7ec8f0; }
    .btn {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      background: #0077ff; color: #fff; border: none; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .btn:active { background: #005bcc; }
    .toolbar button.dpr-1 { font-size: 14px; }
    .toolbar button.dpr-2 { font-size: 33px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <button class="btn" id="toggleNav">🧭 Navigation ein/aus</button>
  <button class="btn" id="trackBtn">▶ Tracking starten</button>
  <div class="hud" id="hud">Bereit…</div>

<script>
// Example: Scaling text size based on device pixel ratio
    const dpr = window.devicePixelRatio || 1;

    document.getElementById('toggleNav').classList.add("dpr-" + dpr); // Add DPR class to the button
    document.getElementById('trackBtn').classList.add("dpr-" + dpr); // Add DPR class to the button


// ─── Karte ────────────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'osm': {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap'
      }
    },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  },
  center: [13.405, 52.52],
  zoom: 14
});


// ─── NavigationControl ────────────────────────────────────────────────────────
//map.addControl(new maplibregl.NavigationControl(), 'top-left');

const nav = new maplibregl.NavigationControl();
map.addControl(nav, 'top-left');

let navVisible = true;

document.getElementById('toggleNav').addEventListener('click', () => {
  if (navVisible) {
    map.removeControl(nav);
  } else {
    map.addControl(nav, 'top-left');
  }
  navVisible = !navVisible;
});

// ─── GPX laden ────────────────────────────────────────────────────────
const GPX_URL = 'https://raw.githubusercontent.com/GISIntern/gpx-examples/master/gpx/1.gpx';

map.on('load', async () => {
  // Pfeil-Icon als Data-URL laden
  const arrowSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <polygon points="16,2 28,28 16,22 4,28" fill="#0077ff" stroke="#fff" stroke-width="2"/>
  </svg>`;
  const img = await map.loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(arrowSvg));
  map.addImage('arrow', img.data);

  // GPX → GeoJSON
  try {
    const res = await fetch(GPX_URL);
    const xml = await res.text();
    const geojson = gpxToGeoJSON(xml);

    map.addSource('gpx', { type: 'geojson', data: geojson });
    map.addLayer({
      id: 'gpx-line',
      type: 'line',
      source: 'gpx',
      paint: { 'line-color': '#ff6600', 'line-width': 4, 'line-dasharray': [2, 1] }
    });

    // Karte auf GPX zentrieren
    const b = map.getBoundsForLayer('gpx-line');
    if (b) map.fitBounds(b, { padding: 40 });
  } catch (e) {
    console.warn('GPX nicht geladen:', e);
  }

  // Position-Source & Layer
  map.addSource('position', {
    type: 'geojson',
    data: { type: 'Feature', properties: { heading: 0 }, geometry: { type: 'Point', coordinates: [13.405, 52.52] } }
  });

  map.addLayer({
    id: 'position-halo',
    type: 'circle',
    source: 'position',
    paint: {
      'circle-radius': 12,
      'circle-color': '#0077ff',
      'circle-opacity': 0.25
    }
  });

  map.addLayer({
    id: 'position-arrow',
    type: 'symbol',
    source: 'position',
    layout: {
      'icon-image': 'arrow',
      'icon-size': 0.7,
      'icon-rotate': ['get', 'heading'],
      'icon-rotation-alignment': 'map',
      'icon-keep-upright': false
    }
  });
});

// ─── GPX Parser (minimal) ─────────────────────────────────────────────
function gpxToGeoJSON(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const trkpts = doc.querySelectorAll('trkpt');
  if (trkpts.length === 0) return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } };

  const coords = [];
  trkpts.forEach(p => {
    const lat = parseFloat(p.getAttribute('lat'));
    const lon = parseFloat(p.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
  });
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
}

// ─── Bearing-Fallback ─────────────────────────────────────────────────
function bearingBetween(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2))
          - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// ─── Position Tracking ────────────────────────────────────────────────
let watchId = null;
let prevPos = null;
let hud = document.getElementById('hud');
let trackBtn = document.getElementById('trackBtn');

function onPosition(pos) {
  const { latitude: lat, longitude: lon, heading, accuracy } = pos.coords;

  // Heading: natives heading nutzen, sonst aus Delta berechnen
  let h = heading;
  if (h == null && prevPos) {
    const dist = maplibregl.LngLat.distanceTo
      ? 0 // Fallback: Distanz-Check
      : 0;
    // Einfache Distanz-Prüfung (Haversine)
    const R = 6371e3;
    const dLat = (lat - prevPos.lat) * Math.PI / 180;
    const dLon = (lon - prevPos.lon) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(prevPos.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    if (d > 1) { // erst ab 1 m Bewegung
      h = bearingBetween(prevPos.lat, prevPos.lon, lat, lon);
    }
  }
  if (h == null) h = 0;

  prevPos = { lat, lon };

  // Source aktualisieren
  const src = map.getSource('position');
  if (src) {
    src.setData({
      type: 'Feature',
      properties: { heading: h },
      geometry: { type: 'Point', coordinates: [lon, lat] }
    });
  }

  // HUD
  hud.innerHTML = `<b>Pos:</b> ${lat.toFixed(5)}, ${lon.toFixed(5)}<br>` +
                  `<b>Heading:</b> ${h.toFixed(0)}° ${heading != null ? '(native)' : '(fallback)'}<br>` +
                  `<b>Accuracy:</b> ±${Math.round(accuracy)} m`;

  // Karte sanft nachziehen (optional)
  map.panTo([lon, lat], { duration: 500 });
}

function startTracking() {
  if (watchId !== null) { stopTracking(); return; }
  watchId = navigator.geolocation.watchPosition(onPosition, err => {
    hud.innerHTML = `<b style="color:#f66">Fehler:</b> ${err.message}`;
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  trackBtn.textContent = '⏹ Tracking stoppen';
  hud.innerHTML = 'Tracking aktiv…';
}

function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  trackBtn.textContent = '▶ Tracking starten';
}

trackBtn.addEventListener('click', startTracking);
</script>
</body>
</html>
