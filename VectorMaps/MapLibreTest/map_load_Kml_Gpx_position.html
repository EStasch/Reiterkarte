<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre – Standort + KML/GPX</title>
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .toolbar {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      display: flex; gap: 8px;
    }
    .toolbar button {
      padding: 8px 14px; border: none; border-radius: 6px;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2);
      cursor: pointer; font-size: 14px;
    }
    .toolbar button:hover { background: #f0f0f0; }
    .toolbar button.dpr-1 { font-size: 14px; }
    .toolbar button.dpr-2 { font-size: 18px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <button id="btn-locate">📍 Standort</button>
    <button id="btn-kml">📂 KML laden</button>
    <button id="btn-gpx">📂 GPX laden</button>
    <button id="btn-clear">✕ Leeren</button>
  </div>
  <input type="file" id="kml-file" accept=".kml" style="display:none" />
  <input type="file" id="gpx-file" accept=".gpx" style="display:none" />

  
  <script>
    // Example: Scaling text size based on device pixel ratio
    const dpr = window.devicePixelRatio || 1;

    document.getElementById('btn-locate').classList.add("dpr-" + dpr); // Add DPR class to the button
    document.getElementById('btn-kml').classList.add("dpr-" + dpr); // Add DPR class to the button
    document.getElementById('btn-gpx').classList.add("dpr-" + dpr); // Add DPR class to the button

    // ── Karte ──────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [10, 51],
      zoom: 5
    });

    // ── Geolocate ──────────────────────────────────────────
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    });
    map.addControl(geolocate);

    document.getElementById('btn-locate').addEventListener('click', () => geolocate.trigger());

    // ── Sources & Layer EINMALIG anlegen ───────────────────
    map.on('load', () => {
      map.addSource('kml-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addSource('gpx-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

      // KML Layer
      map.addLayer({ id: 'kml-fill',  type: 'fill',   source: 'kml-data', filter: ['==', '$type', 'Polygon'],    paint: { 'fill-color': '#27ae60', 'fill-opacity': 0.3 } });
      map.addLayer({ id: 'kml-line',  type: 'line',   source: 'kml-data', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#2980b9', 'line-width': 3 } });
      map.addLayer({ id: 'kml-point', type: 'circle', source: 'kml-data', filter: ['==', '$type', 'Point'],      paint: { 'circle-radius': 6, 'circle-color': '#e74c3c' } });

      // GPX Layer
      map.addLayer({ id: 'gpx-fill',  type: 'fill',   source: 'gpx-data', filter: ['==', '$type', 'Polygon'],    paint: { 'fill-color': '#8e44ad', 'fill-opacity': 0.3 } });
      map.addLayer({ id: 'gpx-line',  type: 'line',   source: 'gpx-data', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#f39c12', 'line-width': 3 } });
      map.addLayer({ id: 'gpx-point', type: 'circle', source: 'gpx-data', filter: ['==', '$type', 'Point'],      paint: { 'circle-radius': 6, 'circle-color': '#16a085' } });

      // Popups
      [['kml-point', 'kml-data'], ['gpx-point', 'gpx-data']].forEach(([layerId, sourceId]) => {
        map.on('click', layerId, (e) => {
          const name = e.features[0].properties.name || '';
          new maplibregl.Popup().setLngLat(e.lngLat).setText(name).addTo(map);
        });
        map.on('mouseenter', layerId, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', layerId, () => map.getCanvas().style.cursor = '');
      });
    });

    // ── Leeren ─────────────────────────────────────────────
    document.getElementById('btn-clear').addEventListener('click', () => {
      map.getSource('kml-data')?.setData({ type: 'FeatureCollection', features: [] });
      map.getSource('gpx-data')?.setData({ type: 'FeatureCollection', features: [] });
    });

    // ── Fit to features ────────────────────────────────────
    function fitToFeatures(features) {
      try {
        const bounds = new maplibregl.LngLatBounds();
        features.forEach(f => {
            const b = new maplibregl.LngLatBounds(f.geometry.coordinates);
            bounds.extend(b);
        });
        if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 50 });
      } catch (error) {
        console.error('Error fitting to features:', error);
      }
    }

    // ── KML laden ──────────────────────────────────────────
    document.getElementById('btn-kml').addEventListener('click', () => {
      document.getElementById('kml-file').click();
    });

    document.getElementById('kml-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const text = await file.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const features = [];

      xml.querySelectorAll('Placemark').forEach(pm => {
        const name = pm.querySelector('name')?.textContent || '';
        const point = pm.querySelector('Point > coordinates');
        const line  = pm.querySelector('LineString > coordinates');
        const poly  = pm.querySelector('Polygon > outerBoundaryIs > LinearRing > coordinates');

        if (point) {
          const [lng, lat] = point.textContent.trim().split(',').map(Number);
          features.push({ type: 'Feature', properties: { name }, geometry: { type: 'Point', coordinates: [lng, lat] } });
        }
        if (line) {
          const coords = line.textContent.trim().split(' ').map(c => c.split(',').map(Number));
          features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
        }
        if (poly) {
          const coords = poly.textContent.trim().split(' ').map(c => c.split(',').map(Number));
          features.push({ type: 'Feature', properties: { name }, geometry: { type: 'Polygon', coordinates: [coords] } });
        }
      });

      if (!features.length) { alert('Keine Placemarks im KML gefunden.'); return; }
      map.getSource('kml-data').setData({ type: 'FeatureCollection', features });
      fitToFeatures(features);
      e.target.value = '';
    });

    // ── GPX laden ──────────────────────────────────────────
    document.getElementById('btn-gpx').addEventListener('click', () => {
      document.getElementById('gpx-file').click();
    });

    document.getElementById('gpx-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const text = await file.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const features = [];

      // Waypoints
      xml.querySelectorAll('wpt').forEach(wpt => {
        const lat = parseFloat(wpt.getAttribute('lat'));
        const lon = parseFloat(wpt.getAttribute('lon'));
        const name = wpt.querySelector('name')?.textContent || '';
        if (!isNaN(lat) && !isNaN(lon)) {
          features.push({ type: 'Feature', properties: { name }, geometry: { type: 'Point', coordinates: [lon, lat] } });
        }
      });

      // Tracks
      xml.querySelectorAll('trk').forEach(trk => {
        const name = trk.querySelector('name')?.textContent || 'Track';
        trk.querySelectorAll('trkseg').forEach(seg => {
          const coords = [];
          seg.querySelectorAll('trkpt').forEach(pt => {
            const lat = parseFloat(pt.getAttribute('lat'));
            const lon = parseFloat(pt.getAttribute('lon'));
            if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
          });
          if (coords.length >= 2) {
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
          }
        });
      });

      // Routes
      xml.querySelectorAll('rte').forEach(rte => {
        const name = rte.querySelector('name')?.textContent || 'Route';
        const coords = [];
        rte.querySelectorAll('rtept').forEach(pt => {
          const lat = parseFloat(pt.getAttribute('lat'));
          const lon = parseFloat(pt.getAttribute('lon'));
          if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
        });
        if (coords.length >= 2) {
          features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
        }
      });

      if (!features.length) { alert('Keine GPX-Elemente gefunden.'); return; }
      map.getSource('gpx-data').setData({ type: 'FeatureCollection', features });
      fitToFeatures(features);
      e.target.value = '';
    });
  </script>
</body>
</html>
