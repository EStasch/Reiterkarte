<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre – GPX + Tracking + Heading</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <!--
  <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" rel="stylesheet" />
  -->
  <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .hud {
      position: absolute; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.7); color: #fff; padding: 10px 14px;
      border-radius: 8px; font-size: 13px; line-height: 1.6;
    }
    .hud b { color: #7ec8f0; }
    .hud.hidden { display: none; }
    .toolbar .hud {
      position: relative; bottom: auto; left: auto;
      text-align: center; 
    }
    .toolbar {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px;
    }
    .btn {
      /*position: absolute; top: 12px; right: 12px; z-index: 10;*/
      background: #0077ff; color: #fff; border: none; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .btn:active { background: #005bcc; }
    .toolbar button.dpr-1 { font-size: 14px; }
    .toolbar button.dpr-2,
    .toolbar button.dpr-3{ 
      font-size: 48px; 
      font-size: calc(1.5vw * var(--dpr));
      /*font-size: calc(clamp(0.9375rem, 0.8523rem + 0.3409vi, 1.125rem) * var(--dpr));*/
    }
    .btn.inactive {
      background: #afafaf;
      color: #464646;
    }

    /*Toggle toolbar fly out*/
      .toolbar-flyout {
      position: relative;
      margin: 10px;
      position: absolute;
      right: 0px;
      width: 13vw;
      min-width: 180px;
      text-align: right;
      }

      #toolbar-toggle {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      }
      #toolbar-toggle.dpr-1 { font-size: 1.2rem; }
      #toolbar-toggle
      { 
         font-size: calc(4rem* var(--dpr)); 
         font-size: calc(3.5vw * var(--dpr));
         font-size: calc(clamp(1.4063rem, 1.2784rem + 0.5114vi, 1.6875rem)* var(--dpr));
      }
      

      #toolbar-toggle:hover {
      background: #555;
      }

      .toolbar {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 6px;
      background: #0909092b;
      border: 1px solid #dddddd5e;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      flex-direction: column;
      min-width: 180px;
      z-index: 1000;
      padding: 15px;
      right: 0px;
      }

      /* Geöffneter Zustand */
      .toolbar.open {
         display: flex;
         gap: 8px;
         flex-direction: column;
      }
    
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="toolbar-flyout">
    <button id="toolbar-toggle" aria-expanded="false">☰</button>
    <div class="toolbar" id="toolbar-menu">
      <button class="btn" id="toggleNav">🧭 Navigation ein/aus</button>
      <button class="btn" id="btn-trackInfo">📂 Track Info ein/aus</button>
      <button class="btn" id="trackBtn">▶ Tracking starten</button>
      <button class="btn" id="btn-gpx">📂 GPX laden</button>
      <button class="btn" id="btn-online">🌐 Online</button>
      <button class="btn" id="btn-save-offline">💾 Speichern</button>
      <button class="btn" id="btn-load-cache">📦 Cache laden</button>
      <div class="hud" id="zoom-display">Zoom: 14.00</div>
      <div class="hud" id="map-status">Online</div>
    </div>
  </div>

  <input type="file" id="gpx-file" accept=".gpx" style="display:none" />
  <div class="hud" id="hud">Bereit…</div>

<script>
let actualZoom = 13;

const STYLE_URL = 'https://estasch.github.io/Reiterkarte/VectorMaps/PMTiles/bm_web_topandosm_wege_poi_01(8)_PMTiles_min_Vercel.json';
const CACHE_KEY = 'gpx-map-cache-v1';

const dpr = window.devicePixelRatio || 1;
const root = document.documentElement;
root.style.setProperty('--dpr', dpr);

function setMode(mode, text) {
  const statusEl = document.getElementById('map-status');
  if (!statusEl) return;
  statusEl.textContent = text;
  statusEl.dataset.mode = mode;
  statusEl.style.background = mode === 'online' ? '#0f766e' : mode === 'cache' ? '#1d4ed8' : '#b45309';
}

function readCache() {
  try {
    const value = localStorage.getItem(CACHE_KEY);
    return value ? JSON.parse(value) : null;
  } catch (err) {
    console.warn('Cache lesen fehlgeschlagen:', err);
    return null;
  }
}

function writeCache(payload) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
    return true;
  } catch (err) {
    console.error('Cache speichern fehlgeschlagen:', err);
    return false;
  }
}

function saveCurrentMapToCache() {
  if (!map) {
    setMode('offline', 'Cache: keine Karte zum Speichern');
    return;
  }

  const payload = {
    center: map.getCenter().toArray(),
    zoom: map.getZoom(),
    styleUrl: STYLE_URL,
    timestamp: Date.now()
  };

  const ok = writeCache(payload);
  setMode(ok ? 'cache' : 'offline', ok ? 'Cache: gespeichert' : 'Cache: Speichern fehlgeschlagen');
}

function restoreFromCache() {
  const cache = readCache();
  if (!cache || !cache.center || typeof cache.zoom !== 'number') {
    setMode('offline', 'Cache: kein gespeicherter Stand');
    return;
  }

  if (!map) {
    initMap(cache.center, cache.zoom);
  } else {
    map.jumpTo({ center: cache.center, zoom: cache.zoom, essential: true });
  }
  setMode('cache', 'Cache aktiv');
}

function initMap(center = [9.375844, 48.498550], zoom = 13) {
  if (map) {
    map.remove();
  }

  let protocol = new pmtiles.Protocol({ metadata: true });
  maplibregl.addProtocol('pmtiles', protocol.tile);

  map = new maplibregl.Map({
    container: 'map',
    style: STYLE_URL,
    center: center,
    zoom: zoom,
    attributionControl: true,
  });

  window.map = map;

  const nav = new maplibregl.NavigationControl();
  map.addControl(nav, 'top-left');

  map.on('load', async () => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
      <polygon points="16,2 28,28 16,22 4,28" fill="#0077ff" stroke="#fff" stroke-width="2"/>
    </svg>`;

    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();

    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 32, 32);

    map.addImage('arrow', ctx.getImageData(0, 0, 32, 32));

    function fitToFeatures(features) {
      const bounds = new maplibregl.LngLatBounds();
      function extendBounds(coords) {
        if (!coords || coords.length === 0) return;
        if (typeof coords[0] === 'number') {
          bounds.extend(coords);
        } else {
          coords.forEach(c => extendBounds(c));
        }
      }

      features.forEach(f => {
        if (!f || !f.geometry || !f.geometry.coordinates) return;
        extendBounds(f.geometry.coordinates);
      });

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds, { padding: 50, maxZoom: 18 });
      }
    }

    map.addSource('gpx-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'gpx-fill', type: 'fill', source: 'gpx-data', filter: ['==', '$type', 'Polygon'], paint: { 'fill-color': '#8e44ad', 'fill-opacity': 0.3 } });
    map.addLayer({ id: 'gpx-line', type: 'line', source: 'gpx-data', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#aa29b9BF', 'line-width': (3 * dpr * (actualZoom / 5)) } });
    map.addLayer({ id: 'gpx-point', type: 'circle', source: 'gpx-data', filter: ['==', '$type', 'Point'], paint: { 'circle-radius': 6, 'circle-color': '#16a085' } });

    map.addSource('position', {
      type: 'geojson',
      data: { type: 'Feature', properties: { heading: 0 }, geometry: { type: 'Point', coordinates: [13.405, 52.52] } }
    });

    map.addLayer({
      id: 'position-halo',
      type: 'circle',
      source: 'position',
      paint: {
        'circle-radius': 12,
        'circle-color': '#0077ff',
        'circle-opacity': 0.25
      }
    });

    map.addLayer({
      id: 'position-arrow',
      type: 'symbol',
      source: 'position',
      layout: {
        'icon-image': 'arrow',
        'icon-size': 0.7,
        'icon-rotate': ['get', 'heading'],
        'icon-rotation-alignment': 'map',
        'icon-keep-upright': false
      }
    });

    document.getElementById('btn-gpx').addEventListener('click', () => {
      document.getElementById('gpx-file').click();
    });

    document.getElementById('gpx-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        const parserError = xml.querySelector('parsererror');
        if (parserError) throw new Error('Die GPX-Datei konnte nicht gelesen werden.');

        const features = [];

        getGpxElements(xml, 'wpt').forEach(wpt => {
          const point = readGpxPoint(wpt);
          if (!point) return;
          features.push({
            type: 'Feature',
            properties: { name: getLocalText(wpt, 'name') },
            geometry: { type: 'Point', coordinates: point }
          });
        });

        getGpxElements(xml, 'trk').forEach(trk => {
          const name = getLocalText(trk, 'name') || 'Track';
          getGpxElements(trk, 'trkseg').forEach(seg => {
            const coords = [];
            getGpxElements(seg, 'trkpt').forEach(pt => {
              const point = readGpxPoint(pt);
              if (point) coords.push(point);
            });
            if (coords.length >= 2) {
              features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
            }
          });
        });

        getGpxElements(xml, 'rte').forEach(rte => {
          const name = getLocalText(rte, 'name') || 'Route';
          const coords = [];
          getGpxElements(rte, 'rtept').forEach(pt => {
            const point = readGpxPoint(pt);
            if (point) coords.push(point);
          });
          if (coords.length >= 2) {
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
          }
        });

        if (!features.length) {
          alert('Keine GPX-Elemente gefunden.');
          return;
        }

        followGPS = false;
        map.getSource('gpx-data').setData({ type: 'FeatureCollection', features });
        map.once('idle', () => fitToFeatures(features));
        fitToFeatures(features);
      } catch (err) {
        console.error(err);
        alert(err.message || 'Die GPX-Datei konnte nicht geladen werden.');
      } finally {
        e.target.value = '';
      }
    });

    setMode('online', 'Online: Karte aktiv');
  });
}

let navVisible = true;

function getGpxElements(root, tagName) {
  const matches = [];
  const allNodes = root.getElementsByTagName('*');

  for (const node of allNodes) {
    const localName = node.localName || node.nodeName.split(':').pop();
    if (localName === tagName) matches.push(node);
  }

  return matches;
}

function getLocalText(node, tagName) {
  const found = getGpxElements(node, tagName)[0];
  return found ? (found.textContent || '').trim() : '';
}

function readGpxPoint(node) {
  const lat = parseFloat(node.getAttribute('lat'));
  const lon = parseFloat(node.getAttribute('lon'));
  if (Number.isNaN(lat) || Number.isNaN(lon)) return null;
  return [lon, lat];
}

document.getElementById('toggleNav').addEventListener('click', () => {
  if (navVisible) {
    map.removeControl(map._controls.find(c => c && c._evented && c._evented._evented));
    document.getElementById('toggleNav').classList.add('inactive');
  } else {
    const nav = new maplibregl.NavigationControl();
    map.addControl(nav, 'top-left');
    document.getElementById('toggleNav').classList.remove('inactive');
  }
  navVisible = !navVisible;
});

map.on('load', async () => {
  // no-op, setup handled in initMap
});

function gpxToGeoJSON(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const trkpts = doc.querySelectorAll('trkpt');
  if (trkpts.length === 0) return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } };

  const coords = [];
  trkpts.forEach(p => {
    const lat = parseFloat(p.getAttribute('lat'));
    const lon = parseFloat(p.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
  });
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
}

function bearingBetween(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2))
          - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

let watchId = null;
let prevPos = null;
let followGPS = false;
let hud = document.getElementById('hud');
let trackBtn = document.getElementById('trackBtn');

function onPosition(pos) {
  const { latitude: lat, longitude: lon, heading, accuracy } = pos.coords;
  let h = heading;

  if (h == null && prevPos) {
    const R = 6371e3;
    const dLat = (lat - prevPos.lat) * Math.PI / 180;
    const dLon = (lon - prevPos.lon) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(prevPos.lat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) * Math.sin(dLon/2)**2;
    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    if (d > 1) {
      h = bearingBetween(prevPos.lat, prevPos.lon, lat, lon);
    }
  }
  if (h == null) h = 0;

  prevPos = { lat, lon };

  const src = map.getSource('position');
  if (src) {
    src.setData({
      type: 'Feature',
      properties: { heading: h },
      geometry: { type: 'Point', coordinates: [lon, lat] }
    });
  }

  hud.innerHTML = `<b>Pos:</b> ${lat.toFixed(5)}, ${lon.toFixed(5)}<br>` +
                  `<b>Heading:</b> ${h.toFixed(0)}° ${heading != null ? '(native)' : '(fallback)'}<br>` +
                  `<b>Accuracy:</b> ±${Math.round(accuracy)} m`;

  if (followGPS) {
    map.panTo([lon, lat], { duration: 500 });
  }
}

function startTracking() {
  if (watchId !== null) { stopTracking(); return; }
  followGPS = true;
  watchId = navigator.geolocation.watchPosition(onPosition, err => {
    hud.innerHTML = `<b style="color:#f66">Fehler:</b> ${err.message}`;
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  trackBtn.textContent = '⏹ Tracking stoppen';
  hud.innerHTML = 'Tracking aktiv…';
}

function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  followGPS = false;
  trackBtn.textContent = '▶ Tracking starten';
}

trackBtn.addEventListener('click', startTracking);

map.on('zoom', () => {
  actualZoom = map.getZoom();
  const zoomDisplay = document.getElementById('zoom-display');
  if (zoomDisplay) {
    zoomDisplay.textContent = `Zoom: ${actualZoom.toFixed(2)}`;
  }
});

const toggle = document.getElementById('toolbar-toggle');
const menu = document.getElementById('toolbar-menu');
const trackInfoBtn = document.getElementById('btn-trackInfo');
const btnOnline = document.getElementById('btn-online');
const btnSaveOffline = document.getElementById('btn-save-offline');
const btnLoadCache = document.getElementById('btn-load-cache');

toggle.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = menu.classList.toggle('open');
  toggle.setAttribute('aria-expanded', isOpen);
});

document.addEventListener('click', (e) => {
  if (!menu.contains(e.target) && e.target !== toggle) {
    menu.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }
});

trackInfoBtn.addEventListener('click', () => {
  hud.classList.toggle('hidden');
  trackInfoBtn.classList.toggle('inactive');
});

btnOnline.addEventListener('click', () => {
  setMode('online', 'Online: Karte aktiv');
  if (!map) initMap();
});

btnSaveOffline.addEventListener('click', saveCurrentMapToCache);
btnLoadCache.addEventListener('click', restoreFromCache);

const cached = readCache();
if (cached && cached.center && typeof cached.zoom === 'number') {
  setMode('cache', 'Cache: Wiederherstellung');
  initMap(cached.center, cached.zoom);
} else {
  initMap();
}

</script>
</body>
</html>
