  <div id="map"></div>
  <div class="toolbar-flyout">
    <button id="toolbar-toggle" aria-expanded="false">☰</button>
    <div class="toolbar" id="toolbar-menu">

        <div class="toolbar-label">Navigation</div>

        <div class="toolbar-label">Offline</div>

        <button class="btn" id="btn-save-offline">💾 Speichern</button>

      <div class="hud" id="zoom-display">Zoom: 14.00</div>

  <input type="file" id="gpx-file" accept=".gpx" style="display:none" />
  <div class="hud" id="hud">Bereit…</div>

<script>
let actualZoom = 13;
let map = null;
let navControl = null;
let pmtilesProtocol = null;

function ensurePmtilesProtocol() {
  if (!pmtilesProtocol) {
    pmtilesProtocol = new pmtiles.Protocol({ metadata: true });
    maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);
  }
  return pmtilesProtocol;
}

function createArchiveSource(archiveKey, archiveBuffer) {
  const normalizedBuffer = archiveBuffer instanceof ArrayBuffer
    ? archiveBuffer
    : archiveBuffer instanceof Uint8Array
      ? archiveBuffer.buffer.slice(
          archiveBuffer.byteOffset,
          archiveBuffer.byteOffset + archiveBuffer.byteLength
        )
      : archiveBuffer && archiveBuffer.buffer instanceof ArrayBuffer
        ? archiveBuffer.buffer.slice(
            archiveBuffer.byteOffset,
            archiveBuffer.byteOffset + archiveBuffer.byteLength
          )
        : new Uint8Array(archiveBuffer).buffer;

  const bytes = new Uint8Array(normalizedBuffer);
  return {
    getKey: () => archiveKey,
    getBytes: async (offset, length) => {
      if (offset < 0 || offset >= bytes.length) {
        return { data: new ArrayBuffer(0), etag: null, cacheControl: null, expires: null };
      }
      const end = Math.min(bytes.length, offset + length);
      const slice = bytes.subarray(offset, end);
      return {
        data: slice.buffer.slice(slice.byteOffset, slice.byteOffset + slice.byteLength),
        etag: null,
        cacheControl: null,
        expires: null
      };
    }
  };
}

function registerArchiveSource(archiveKey, archiveBuffer) {
  if (!pmtiles || !pmtiles.PMTiles || !pmtiles.Protocol) {
    throw new Error('PMTiles-Library fehlt');
  }

  const protocol = ensurePmtilesProtocol();
  const source = createArchiveSource(archiveKey, archiveBuffer);
  const pmTiles = new pmtiles.PMTiles(source);
  protocol.add(pmTiles);
  return { protocol, pmTiles, archiveKey };
}

const STYLE_URL = 'https://estasch.github.io/Reiterkarte/VectorMaps/PMTiles/bm_web_topandosm_wege_poi_01(8)_PMTiles_min_Vercel.json';
const PMTILES_ARCHIVE_URL = 'https://reiterkarte.vercel.app/OsmMaptiles/ALB_Wege_min.pmtiles';
const PMTILES_ARCHIVE_URL_POI = 'https://reiterkarte.vercel.app/OsmMaptiles/ALB_POI_min.pmtiles';
const PMTILES_DB_NAME = 'reiterkarte-pmtiles-offline';
const PMTILES_STORE_NAME = 'pmtiles';
const PMTILES_KEY = 'ALB_Wege_min.pmtiles';
const PMTILES_KEY_POI = 'ALB_POI_min.pmtiles';
const PMTILES_ARCHIVE_KEYS = [PMTILES_KEY, PMTILES_KEY_POI];
const PMTILES_ARCHIVE_URLS = [
  { key: PMTILES_KEY, url: PMTILES_ARCHIVE_URL },
  { key: PMTILES_KEY_POI, url: PMTILES_ARCHIVE_URL_POI }
];
const VIEW_KEY = 'gpx-map-view-v1';



const dpr = window.devicePixelRatio || 1;
const root = document.documentElement;
root.style.setProperty('--dpr', dpr);

function setMode(mode, text) {
  const statusEl = document.getElementById('map-status');
  if (!statusEl) return;

  const icon = statusEl.querySelector('.status-icon');
  const label = statusEl.querySelector('span:last-of-type');
  const iconMap = { online: '●', cache: '●', offline: '●', saving: '◉' };

  if (icon) icon.textContent = iconMap[mode] || '●';
  if (label) label.textContent = text;
  statusEl.dataset.mode = mode;

  const onlineBtn = document.getElementById('btn-online');
  const loadBtn = document.getElementById('btn-load-cache');
  const saveBtn = document.getElementById('btn-save-offline');
  const deleteBtn = document.getElementById('btn-delete-offline');

  [onlineBtn, loadBtn, saveBtn, deleteBtn].forEach((btn) => {
    if (!btn) return;
    btn.classList.remove('active', 'warning');
  });

  if (onlineBtn && mode === 'online') onlineBtn.classList.add('active');
  if (loadBtn && mode === 'cache') loadBtn.classList.add('active');
  if (saveBtn && mode === 'saving') saveBtn.classList.add('active');
  if (deleteBtn && mode === 'offline') deleteBtn.classList.add('warning');
}

function openOfflineArchiveDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(PMTILES_DB_NAME, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(PMTILES_STORE_NAME)) {
        db.createObjectStore(PMTILES_STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB konnte nicht geöffnet werden.'));
  });
}

function idbPut(key, value) {
  return openOfflineArchiveDB().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(PMTILES_STORE_NAME, 'readwrite');
    tx.objectStore(PMTILES_STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('IndexedDB write failed.'));
  }));
}

function idbGet(key) {
  return openOfflineArchiveDB().then((db) => new Promise((resolve, reject) => {
    const request = db.transaction(PMTILES_STORE_NAME, 'readonly')
      .objectStore(PMTILES_STORE_NAME)
      .get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB read failed.'));
  }));
}

function idbDelete(key) {
  return openOfflineArchiveDB().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(PMTILES_STORE_NAME, 'readwrite');
    tx.objectStore(PMTILES_STORE_NAME).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('IndexedDB delete failed.'));
  }));
}

function getCurrentMapView() {
  if (!map) {
    return { center: [9.375844, 48.498550], zoom: 13 };
  }

  const center = map.getCenter();
  return {
    center: [center.lng, center.lat],
    zoom: map.getZoom()
  };
}

function saveMapViewToIndexedDB() {
  const view = getCurrentMapView();
  return idbPut(VIEW_KEY, view).catch(() => false);
}

function readMapViewFromIndexedDB() {
  return idbGet(VIEW_KEY).then((value) => value || null).catch(() => null);
}

function getPmtilesArchiveEntriesFromStyle(style) {
  const entries = [];
  const seen = new Set();

  for (const [sourceName, source] of Object.entries(style.sources || {})) {
    if (!source || source.type !== 'vector') continue;

    const pmtilesUrl = source.url || (Array.isArray(source.tiles) ? source.tiles[0] : null);
    if (typeof pmtilesUrl !== 'string' || !pmtilesUrl.startsWith('pmtiles://')) continue;

    const rawArchiveUrl = pmtilesUrl.replace(/^pmtiles:\/\//, '');
    const archiveKey = decodeURIComponent(rawArchiveUrl.split('/').pop() || rawArchiveUrl);
    if (!archiveKey || seen.has(archiveKey)) continue;

    seen.add(archiveKey);
    entries.push({ key: archiveKey, sourceName, url: pmtilesUrl });
  }

  return entries;
}

function saveCurrentMapToCache() {
  if (!map) {
    setMode('offline', 'Offline: keine Karte zum Speichern');
    return;
  }

  setMode('saving', 'Offline: PMTiles wird gespeichert…');

  Promise.all(
    PMTILES_ARCHIVE_URLS.map(({ key, url }) =>
      fetch(url)
        .then((response) => {
          if (!response.ok) throw new Error(`PMTiles-Download fehlgeschlagen (${response.status}) für ${key}`);
          return response.arrayBuffer();
        })
        .then((archiveBuffer) => idbPut(key, archiveBuffer))
    )
  )
    .then(async () => {
      await saveMapViewToIndexedDB();
      setMode('cache', 'Offline: PMTiles archiviert');
    })
    .catch((error) => {
      console.error(error);
      setMode('offline', 'Offline: Speichern fehlgeschlagen');
    });
}

function deleteOfflineArchive() {
  Promise.all([
    idbDelete(PMTILES_KEY),
    idbDelete(PMTILES_KEY_POI),
    idbDelete(VIEW_KEY)
  ])
    .then(() => {
      setMode('offline', 'Offline: Archiv gelöscht');
      initMap();
    })
    .catch((error) => {
      console.error(error);
      setMode('offline', 'Offline: Löschen fehlgeschlagen');
    });
}

function buildOfflineStyleFromArchive() {
  return fetch(STYLE_URL)
    .then((response) => response.json())
    .then((style) => {
      const archiveEntries = getPmtilesArchiveEntriesFromStyle(style);

      archiveEntries.forEach(({ sourceName, url }) => {
        const source = style.sources[sourceName];
        if (!source) return;

        source.url = url;
        source.tiles = [url + '/{z}/{x}/{y}'];
      });

      return style;
    });
}

function ensureGpxSourcesAndLayers() {
  if (!map) return;

  if (!map.getSource('gpx-data')) {
    map.addSource('gpx-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({ id: 'gpx-fill', type: 'fill', source: 'gpx-data', filter: ['==', '$type', 'Polygon'], paint: { 'fill-color': '#8e44ad', 'fill-opacity': 0.3 } });
    map.addLayer({ id: 'gpx-line', type: 'line', source: 'gpx-data', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#aa29b9BF', 'line-width': (3 * dpr * (actualZoom / 5)) } });
    map.addLayer({ id: 'gpx-point', type: 'circle', source: 'gpx-data', filter: ['==', '$type', 'Point'], paint: { 'circle-radius': 6, 'circle-color': '#16a085' } });
  }

  if (!map.getSource('position')) {
    map.addSource('position', {
      type: 'geojson',
      data: { type: 'Feature', properties: { heading: 0 }, geometry: { type: 'Point', coordinates: [13.405, 52.52] } }
    });
    map.addLayer({
      id: 'position-halo',
      type: 'circle',
      source: 'position',
      paint: {
        'circle-radius': 12,
        'circle-color': '#0077ff',
        'circle-opacity': 0.25
      }
    });
    map.addLayer({
      id: 'position-arrow',
      type: 'symbol',
      source: 'position',
      layout: {
        'icon-image': 'arrow',
        'icon-size': 0.7,
        'icon-rotate': ['get', 'heading'],
        'icon-rotation-alignment': 'map',
        'icon-keep-upright': false
      }
    });
  }
}

function createMap(style, center, zoom) {
  if (map) {
    map.remove();
    map = null;
  }

  map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: center,
    zoom: zoom,
    attributionControl: true,
  });

  window.map = map;
  navControl = new maplibregl.NavigationControl();
  map.addControl(navControl, 'top-left');

  map.on('load', async () => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
      <polygon points="16,2 28,28 16,22 4,28" fill="#0077ff" stroke="#fff" stroke-width="2"/>
    </svg>`;

    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();

    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 32, 32);

    map.addImage('arrow', ctx.getImageData(0, 0, 32, 32));
    ensureGpxSourcesAndLayers();
  });

  map.on('zoom', () => {
    actualZoom = map.getZoom();
    const zoomDisplay = document.getElementById('zoom-display');
    if (zoomDisplay) {
      zoomDisplay.textContent = `Zoom: ${actualZoom.toFixed(2)}`;
    }
  });
}

function loadOnlineMap() {
  ensurePmtilesProtocol();
  setMode('online', 'Online: Karte aktiv');
  createMap(STYLE_URL, [9.375844, 48.498550], 13);
}

function restoreFromCache() {
  readMapViewFromIndexedDB().then((view) => {
    if (!view || !Array.isArray(view.center) || typeof view.zoom !== 'number') {
      setMode('offline', 'Offline: kein gespeichertes Archiv');
      return;
    }

    Promise.all(PMTILES_ARCHIVE_KEYS.map((key) => idbGet(key)))
      .then((archiveBuffers) => {
        if (!archiveBuffers || !archiveBuffers.length || archiveBuffers.every((buffer) => !buffer)) {
          setMode('offline', 'Offline: kein gespeichertes Archiv');
          return;
        }

        if (!window.pmtiles || !window.pmtiles.PMTiles || !window.pmtiles.Protocol) {
          setMode('offline', 'Offline: PMTiles-Library fehlt');
          return;
        }

        try {
          ensurePmtilesProtocol();

          archiveBuffers.forEach((archiveBuffer, index) => {
            if (!archiveBuffer) return;
            const archiveKey = PMTILES_ARCHIVE_KEYS[index];
            const archiveSource = createArchiveSource(archiveKey, archiveBuffer);
            const archiveInstance = new window.pmtiles.PMTiles(archiveSource);
            pmtilesProtocol.add(archiveInstance);
          });

          buildOfflineStyleFromArchive().then((style) => {
            createMap(style, view.center, view.zoom);
            setMode('cache', 'Cache aktiv');
          }).catch((error) => {
            console.error(error);
            setMode('offline', 'Offline: Style konnte nicht geladen werden');
          });
        } catch (error) {
          console.error(error);
          setMode('offline', 'Offline: Archiv konnte nicht geladen werden');
        }
      })
      .catch((error) => {
        console.error(error);
        setMode('offline', 'Offline: Archiv konnte nicht geladen werden');
      });
  });
}

function initMap(center = [9.375844, 48.498550], zoom = 13) {
  ensurePmtilesProtocol();
  createMap(STYLE_URL, center, zoom);
  setMode('online', 'Online: Karte aktiv');
}

let navVisible = true;

function getGpxElements(root, tagName) {
  const matches = [];
  const allNodes = root.getElementsByTagName('*');

  for (const node of allNodes) {
    const localName = node.localName || node.nodeName.split(':').pop();
    if (localName === tagName) matches.push(node);
  }

  return matches;
}

function getLocalText(node, tagName) {
  const found = getGpxElements(node, tagName)[0];
  return found ? (found.textContent || '').trim() : '';
}

function readGpxPoint(node) {
  const lat = parseFloat(node.getAttribute('lat'));
  const lon = parseFloat(node.getAttribute('lon'));
  if (Number.isNaN(lat) || Number.isNaN(lon)) return null;
  return [lon, lat];
}

document.getElementById('toggleNav').addEventListener('click', () => {
  if (!map) return;

  if (navVisible) {
    if (navControl) {
      map.removeControl(navControl);
    }
    document.getElementById('toggleNav').classList.add('inactive');
  } else if (navControl) {
    map.addControl(navControl, 'top-left');
    document.getElementById('toggleNav').classList.remove('inactive');
  }
  navVisible = !navVisible;
});

function gpxToGeoJSON(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const trkpts = doc.querySelectorAll('trkpt');
  if (trkpts.length === 0) return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } };

  const coords = [];
  trkpts.forEach((pointNode) => {
    const lat = parseFloat(pointNode.getAttribute('lat'));
    const lon = parseFloat(pointNode.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
  });
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };
}

function bearingBetween(lat1, lon1, lat2, lon2) {
  const toRad = (degree) => degree * Math.PI / 180;
  const toDeg = (radian) => radian * 180 / Math.PI;
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2))
    - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

let watchId = null;
let prevPos = null;
let followGPS = false;
let hud = document.getElementById('hud');
let trackBtn = document.getElementById('trackBtn');
let gpxControlsBound = false;

function bindGpxFileControls() {
  if (gpxControlsBound) return;

  const gpxButton = document.getElementById('btn-gpx');
  const gpxFileInput = document.getElementById('gpx-file');
  if (!gpxButton || !gpxFileInput) return;

  gpxButton.addEventListener('click', () => {
    gpxFileInput.click();
  });

  gpxFileInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
      const text = await file.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const parserError = xml.querySelector('parsererror');
      if (parserError) throw new Error('Die GPX-Datei konnte nicht gelesen werden.');

      const features = [];
      getGpxElements(xml, 'wpt').forEach((wpt) => {
        const point = readGpxPoint(wpt);
        if (!point) return;
        features.push({
          type: 'Feature',
          properties: { name: getLocalText(wpt, 'name') },
          geometry: { type: 'Point', coordinates: point }
        });
      });

      getGpxElements(xml, 'trk').forEach((trk) => {
        const name = getLocalText(trk, 'name') || 'Track';
        getGpxElements(trk, 'trkseg').forEach((seg) => {
          const coords = [];
          getGpxElements(seg, 'trkpt').forEach((pt) => {
            const point = readGpxPoint(pt);
            if (point) coords.push(point);
          });
          if (coords.length >= 2) {
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
          }
        });
      });

      getGpxElements(xml, 'rte').forEach((rte) => {
        const name = getLocalText(rte, 'name') || 'Route';
        const coords = [];
        getGpxElements(rte, 'rtept').forEach((pt) => {
          const point = readGpxPoint(pt);
          if (point) coords.push(point);
        });
        if (coords.length >= 2) {
          features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
        }
      });

      if (!features.length) {
        alert('Keine GPX-Elemente gefunden.');
        return;
      }

      if (!map) {
        alert('Karte nicht verfügbar.');
        return;
      }

      followGPS = false;
      const gpxSource = map.getSource('gpx-data');
      if (gpxSource) {
        gpxSource.setData({ type: 'FeatureCollection', features });
      }
      map.once('idle', () => {
        const bounds = new maplibregl.LngLatBounds();
        features.forEach((feature) => {
          if (!feature || !feature.geometry || !feature.geometry.coordinates) return;
          const coords = feature.geometry.coordinates;
          const walk = (value) => {
            if (!value || value.length === 0) return;
            if (typeof value[0] === 'number') {
              bounds.extend(value);
            } else {
              value.forEach(walk);
            }
          };
          walk(coords);
        });
        if (!bounds.isEmpty()) {
          map.fitBounds(bounds, { padding: 50, maxZoom: 18 });
        }
      });
    } catch (error) {
      console.error(error);
      alert(error.message || 'Die GPX-Datei konnte nicht geladen werden.');
    } finally {
      event.target.value = '';
    }
  });

  gpxControlsBound = true;
}

function onPosition(pos) {
  const { latitude: lat, longitude: lon, heading, accuracy } = pos.coords;
  let h = heading;

  if (h == null && prevPos) {
    const R = 6371e3;
    const dLat = (lat - prevPos.lat) * Math.PI / 180;
    const dLon = (lon - prevPos.lon) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(prevPos.lat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    if (d > 1) {
      h = bearingBetween(prevPos.lat, prevPos.lon, lat, lon);
    }
  }
  if (h == null) h = 0;

  prevPos = { lat, lon };

  const src = map && map.getSource ? map.getSource('position') : null;
  if (src) {
    src.setData({
      type: 'Feature',
      properties: { heading: h },
      geometry: { type: 'Point', coordinates: [lon, lat] }
    });
  }

  hud.innerHTML = `<b>Pos:</b> ${lat.toFixed(5)}, ${lon.toFixed(5)}<br>` +
                  `<b>Heading:</b> ${h.toFixed(0)}° ${heading != null ? '(native)' : '(fallback)'}<br>` +
                  `<b>Accuracy:</b> ±${Math.round(accuracy)} m`;

  if (followGPS && map) {
    map.panTo([lon, lat], { duration: 500 });
  }
}

function startTracking() {
  if (watchId !== null) { stopTracking(); return; }
  followGPS = true;
  watchId = navigator.geolocation.watchPosition(onPosition, (error) => {
    hud.innerHTML = `<b style="color:#f66">Fehler:</b> ${error.message}`;
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  trackBtn.textContent = '⏹ Tracking stoppen';
  hud.innerHTML = 'Tracking aktiv…';
}

function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  followGPS = false;
  trackBtn.textContent = '▶ Tracking starten';
}

trackBtn.addEventListener('click', startTracking);

  .then((view) => {
    if (view && Array.isArray(view.center) && typeof view.zoom === 'number') {
      setMode('cache', 'Cache: Wiederherstellung');
      Promise.all(PMTILES_ARCHIVE_KEYS.map((key) => idbGet(key))).then((archiveBuffers) => {
        const hasAnyArchive = archiveBuffers.some((buffer) => !!buffer);
        if (!hasAnyArchive) {
          initMap();
          return;
        }

        try {
          ensurePmtilesProtocol();

          archiveBuffers.forEach((archiveBuffer, index) => {
            if (!archiveBuffer) return;
            const archiveKey = PMTILES_ARCHIVE_KEYS[index];
            const archiveSource = createArchiveSource(archiveKey, archiveBuffer);
            const archiveInstance = new window.pmtiles.PMTiles(archiveSource);
            pmtilesProtocol.add(archiveInstance);
          });

          buildOfflineStyleFromArchive().then((style) => {
            createMap(style, view.center, view.zoom);
            setMode('cache', 'Cache aktiv');
          }).catch(() => initMap());
        } catch (error) {
          console.error(error);
          initMap();
        }
      }).catch(() => initMap());
    } else {
      initMap();
    }
  })
  .catch(() => initMap());
