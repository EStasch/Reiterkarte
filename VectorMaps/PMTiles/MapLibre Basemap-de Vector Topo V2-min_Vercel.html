<!DOCTYPE html>
<html>

<head>
   <title>basemap.de Web Vektor - MapLibre GL JS Demo</title>
   <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" crossorigin="anonymous">
        <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
   <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
   <script src="../Javascript/scaleTextOnLayersforHD.js"></script>
   <style>
      body {
         margin: 0;
         padding: 0;
      }

      #map {
         position: absolute;
         top: 0;
         bottom: 0;
         width: 100%;
      }
      #zoom-display{
                font-size: 1em;
      }

      .toolbar {
         position: absolute; top: 10px; left: 10px; z-index: 20;
         display: flex; gap: 8px;
         flex-direction: column;
      }
      .toolbar button {
         padding: 8px 14px; border: none; border-radius: 6px;
         background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2);
         cursor: pointer; font-size: 14px;
      }
      .toolbar button:hover { background: #f0f0f0; }
      .toolbar button.dpr-1 { font-size: 14px; }
      .toolbar button.dpr-2 { font-size: 44px; }

      /*Toggle toolbar fly out*/
      .toolbar-flyout {
      position: relative;
      }

      #toolbar-toggle {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      }
      #toolbar-toggle.dpr-1 { font-size: 1.1rem; }
      #toolbar-toggle.dpr-2 { font-size: 2.2rem; }

      #toolbar-toggle:hover {
      background: #555;
      }

      .toolbar {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 6px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      flex-direction: column;
      min-width: 180px;
      z-index: 1000;
      }

      /* Geöffneter Zustand */
      .toolbar.open {
         display: flex;
         gap: 8px;
         flex-direction: column;
      }

      /*
      .toolbar button {
      padding: 10px 14px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s;
      }

      .toolbar button:hover {
      background: #f0f0f0;
      } 
      */  
   </style>
</head>

<body>
   <div id="map" class="map"></div>

   <div class="toolbar-flyout">
   <button id="toolbar-toggle" aria-expanded="false">☰</button>
      <div class="toolbar" id="toolbar-menu">
         <button id="btn-locate">📍 Standort</button>
         <button id="btn-kml">📂 KML laden</button>
         <button id="btn-gpx">📂 GPX laden</button>
         <button id="btn-clear">✕ Leeren</button>
         <button id="toggleNav">🧭 Navigation ein/aus</button>
      </div>
   </div>
  <input type="file" id="kml-file" accept=".kml" style="display:none" />
  <input type="file" id="gpx-file" accept=".gpx" style="display:none" />

   <div id="zoom-container" style="background-color: rgba(250, 246, 246, 0.875);position: absolute;top: 50px;right: 50px;">
            <span>Zoom: </span>
            <span id="zoom-display">13</span><br>
            <span>DPR: </span><span id="dpr"></span><br>
            <div id="dimenstions"></div>
        </div>
   <script>
      // add the PMTiles plugin to the maplibregl global.
      // setting metadata = true fills out the "attribution" field of the source, and is required for some inspector applications,
      // but requires an additional blocking HTTP request before loading the map.
      let protocol = new pmtiles.Protocol({metadata: true});
      maplibregl.addProtocol("pmtiles", protocol.tile);

      let actualZoom = 13;

      // Example: Scaling text size based on device pixel ratio
      const dpr = window.devicePixelRatio || 1;
      //const dpr = 2; // for testing purposes, set a fixed DPR value
      document.getElementById('dpr').textContent = dpr;
      
      document.getElementById('btn-locate').classList.add("dpr-" + dpr); // Add DPR class to the button
      document.getElementById('btn-kml').classList.add("dpr-" + dpr); // Add DPR class to the button
      document.getElementById('btn-gpx').classList.add("dpr-" + dpr); // Add DPR class to the button
      document.getElementById('toggleNav').classList.add("dpr-" + dpr); // Add DPR class to the button
      document.getElementById('toolbar-toggle').classList.add("dpr-" + dpr); // Add DPR class to the button


      // ── Karte ──────────────────────────────────────────────
      var map = new maplibregl.Map({
         container: 'map',
         style: 'https://estasch.github.io/Reiterkarte/VectorMaps/PMTiles/bm_web_topandosm_wege_poi_01(8)_PMTiles_min_Vercel.json',
         center: [9.375844,48.498550],
         zoom: 13,
      });

      //map.showTileBoundaries = true;

      // Add zoom and rotation controls to the map.
      
      map.addControl(new maplibregl.NavigationControl({
         visualizePitch: true,
         visualizeRoll: true,
         showZoom: true,
         showCompass: true
      }));
      
      // ─── NavigationControl ────────────────────────────────────────────────────────
   //map.addControl(new maplibregl.NavigationControl(), 'top-left');

   const nav = new maplibregl.NavigationControl({
         visualizePitch: true,
         visualizeRoll: true,
         showZoom: true,
         showCompass: true
      });
   map.addControl(nav, 'top-right');

   let navVisible = true;

   document.getElementById('toggleNav').addEventListener('click', () => {
   if (navVisible) {
      map.removeControl(nav);
   } else {
      map.addControl(nav, 'top-right');
   }
   navVisible = !navVisible;
   });

      // ── Geolocate ──────────────────────────────────────────
      const geolocate = new maplibregl.GeolocateControl({
         positionOptions: { enableHighAccuracy: true },
         trackUserLocation: true,
         showUserHeading: true
      });
      map.addControl(geolocate);

      document.getElementById('btn-locate').addEventListener('click', () => geolocate.trigger());

      // ── Sources & Layer EINMALIG anlegen ───────────────────
      map.on('load', () => {
         map.addSource('kml-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
         map.addSource('gpx-data', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

         // KML Layer
         map.addLayer({ id: 'kml-fill',  type: 'fill',   source: 'kml-data', filter: ['==', '$type', 'Polygon'],    paint: { 'fill-color': '#27ae60', 'fill-opacity': 0.3 } });
         map.addLayer({ id: 'kml-line',  type: 'line',   source: 'kml-data', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#2980b9BF', 'line-width': (3 * dpr * (actualZoom/10)) } });
         map.addLayer({ id: 'kml-point', type: 'circle', source: 'kml-data', filter: ['==', '$type', 'Point'],      paint: { 'circle-radius': 6, 'circle-color': '#e74c3c' } });

         // GPX Layer
         map.addLayer({ id: 'gpx-fill',  type: 'fill',   source: 'gpx-data', filter: ['==', '$type', 'Polygon'],    paint: { 'fill-color': '#8e44ad', 'fill-opacity': 0.3 } });
         map.addLayer({ id: 'gpx-line',  type: 'line',   source: 'gpx-data', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#aa29b9BF', 'line-width': (3 * dpr * (actualZoom/10)) } });  
         map.addLayer({ id: 'gpx-point', type: 'circle', source: 'gpx-data', filter: ['==', '$type', 'Point'],      paint: { 'circle-radius': 6, 'circle-color': '#16a085' } });

         // Popups
         [['kml-point', 'kml-data'], ['gpx-point', 'gpx-data']].forEach(([layerId, sourceId]) => {
         map.on('click', layerId, (e) => {
            const name = e.features[0].properties.name || '';
            new maplibregl.Popup().setLngLat(e.lngLat).setText(name).addTo(map);
         });
         map.on('mouseenter', layerId, () => map.getCanvas().style.cursor = 'pointer');
         map.on('mouseleave', layerId, () => map.getCanvas().style.cursor = '');
         });
      });

      // ── Leeren ─────────────────────────────────────────────
      document.getElementById('btn-clear').addEventListener('click', () => {
         map.getSource('kml-data')?.setData({ type: 'FeatureCollection', features: [] });
         map.getSource('gpx-data')?.setData({ type: 'FeatureCollection', features: [] });
      });
      // ── Layer Control ─────────────────────────────────────────────
      //map.addControl(kml-line, 'top-left');      
      //map.addControl(gpx-line, 'top-left');

      // ── Fit to features ────────────────────────────────────
      function fitToFeatures(features) {
        const bounds = new maplibregl.LngLatBounds();

        function extendBounds(coords) {
            if (typeof coords[0] === 'number') {
            // Einzelner Punkt: [lng, lat]
            bounds.extend(coords);
            } else {
            // Array von Punkten → rekursiv
            coords.forEach(c => extendBounds(c));
            }
        }

        features.forEach(f => extendBounds(f.geometry.coordinates));

        if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 50 });
      }  

      // ── KML laden ──────────────────────────────────────────
      document.getElementById('btn-kml').addEventListener('click', () => {
         document.getElementById('kml-file').click();
      });

      document.getElementById('kml-file').addEventListener('change', async (e) => {
         const file = e.target.files[0];
         if (!file) return;

         const text = await file.text();
         const xml = new DOMParser().parseFromString(text, 'application/xml');
         const features = [];

         xml.querySelectorAll('Placemark').forEach(pm => {
         const name = pm.querySelector('name')?.textContent || '';
         const point = pm.querySelector('Point > coordinates');
         const line  = pm.querySelector('LineString > coordinates');
         const poly  = pm.querySelector('Polygon > outerBoundaryIs > LinearRing > coordinates');

         if (point) {
            const [lng, lat] = point.textContent.trim().split(',').map(Number);
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'Point', coordinates: [lng, lat] } });
         }
         if (line) {
            const coords = line.textContent.trim().split(' ').map(c => c.split(',').map(Number));
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
         }
         if (poly) {
            const coords = poly.textContent.trim().split(' ').map(c => c.split(',').map(Number));
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'Polygon', coordinates: [coords] } });
         }
         });

         if (!features.length) { alert('Keine Placemarks im KML gefunden.'); return; }
         map.getSource('kml-data').setData({ type: 'FeatureCollection', features });
         fitToFeatures(features);
         e.target.value = '';
      });
      // ── KML laden ──────────────────────────────────────────

      // ── GPX laden ──────────────────────────────────────────
      document.getElementById('btn-gpx').addEventListener('click', () => {
         document.getElementById('gpx-file').click();
      });

      document.getElementById('gpx-file').addEventListener('change', async (e) => {
         const file = e.target.files[0];
         if (!file) return;

         const text = await file.text();
         const xml = new DOMParser().parseFromString(text, 'application/xml');
         const features = [];

         // Waypoints
         xml.querySelectorAll('wpt').forEach(wpt => {
         const lat = parseFloat(wpt.getAttribute('lat'));
         const lon = parseFloat(wpt.getAttribute('lon'));
         const name = wpt.querySelector('name')?.textContent || '';
         if (!isNaN(lat) && !isNaN(lon)) {
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'Point', coordinates: [lon, lat] } });
         }
         });

         // Tracks
         xml.querySelectorAll('trk').forEach(trk => {
         const name = trk.querySelector('name')?.textContent || 'Track';
         trk.querySelectorAll('trkseg').forEach(seg => {
            const coords = [];
            seg.querySelectorAll('trkpt').forEach(pt => {
               const lat = parseFloat(pt.getAttribute('lat'));
               const lon = parseFloat(pt.getAttribute('lon'));
               if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
            });
            if (coords.length >= 2) {
               features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
            }
         });
         });

         // Routes
         xml.querySelectorAll('rte').forEach(rte => {
         const name = rte.querySelector('name')?.textContent || 'Route';
         const coords = [];
         rte.querySelectorAll('rtept').forEach(pt => {
            const lat = parseFloat(pt.getAttribute('lat'));
            const lon = parseFloat(pt.getAttribute('lon'));
            if (!isNaN(lat) && !isNaN(lon)) coords.push([lon, lat]);
         });
         if (coords.length >= 2) {
            features.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coords } });
         }
         });

         if (!features.length) { alert('Keine GPX-Elemente gefunden.'); return; }
         map.getSource('gpx-data').setData({ type: 'FeatureCollection', features });
         fitToFeatures(features);
         e.target.value = '';
      });
      // ── GPX laden ──────────────────────────────────────────

      
      
      
      
      // Beispiel: Aktualisieren eines HTML-Elements mit der ID 'zoom-display'
      map.on('zoom', () => {
            actualZoom = map.getZoom();
            document.getElementById('zoom-display').textContent = actualZoom.toFixed(2);
      });

      map.on('style.load', () => {
        const layerSearchString = "poi_|text_|Name_";
        scaleTextOnLayersforHD(map,layerSearchString,dpr);      

      });

      if (isMobileDevice()) {
         console.log("Mobiles Ger�t erkannt");
      }

      function getScreenDimentions() {
         document.getElementById("dimenstions").innerHTML = 
         "Mobil Device: " + isMobileDevice() +"<br/>"+
         "Display Width : " + screen.width +"<br/> Display Height : " + screen.height;
      }
      
      function isMobileDevice() {
      // 1. Moderne L�sung: Client Hints API (Chromium-Browser)
      if (navigator.userAgentData) {
         console.log(navigator.userAgentData)
         return navigator.userAgentData.mobile;
      }
      
      // 2. Fallback: User-Agent Regex (f�r Safari, Firefox und �ltere Browser)
      console.log(navigator.userAgent)
      return /Mobi|Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      // ── Toggle toolbar fly out ──────────────────────────────────────────
      //Toggle toolbar fly out
      const toggle = document.getElementById('toolbar-toggle');
      const menu = document.getElementById('toolbar-menu');

      toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
      });

      // Schließen bei Klick außerhalb
      document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== toggle) {
         menu.classList.remove('open');
         toggle.setAttribute('aria-expanded', 'false');
      }
      });   

      
   </script>
</body>

</html>
