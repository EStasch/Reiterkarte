<!DOCTYPE html>
<html>

<head>
   <title>basemap.de Web Vektor - MapLibre GL JS Demo</title>
   <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" crossorigin="anonymous">
        <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
   <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
   <script src="../Javascript/scaleTextOnLayersforHD.js"></script>
   <style>
      body {
         margin: 0;
         padding: 0;
      }

      #map {
         position: absolute;
         top: 0;
         bottom: 0;
         width: 100%;
      }
      #zoom-display{
                font-size: 1em;
      }

      .toolbar {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      display: flex; gap: 8px;
      }
      .toolbar button {
         padding: 8px 14px; border: none; border-radius: 6px;
         background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2);
         cursor: pointer; font-size: 14px;
      }
      .toolbar button:hover { background: #f0f0f0; }
      .toolbar button.dpr-1 { font-size: 14px; }
      .toolbar button.dpr-2 { font-size: 18px; }
   </style>
</head>

<body>
   <div id="map" class="map"></div>

   <div class="toolbar">
    <button id="btn-locate">📍 Standort</button>
    <button id="btn-kml">📂 KML laden</button>
  </div>
   <div id="zoom-container" style="background-color: rgba(250, 246, 246, 0.875);position: absolute;top: 50px;right: 50px;">
            <span>Zoom: </span>
            <span id="zoom-display">13</span><br>
            <span>DPR: </span><span id="dpr"></span><br>
            <div id="dimenstions"></div>
        </div>
   <script>
      // add the PMTiles plugin to the maplibregl global.
      // setting metadata = true fills out the "attribution" field of the source, and is required for some inspector applications,
      // but requires an additional blocking HTTP request before loading the map.
      let protocol = new pmtiles.Protocol({metadata: true});
      maplibregl.addProtocol("pmtiles", protocol.tile);

      

      // Example: Scaling text size based on device pixel ratio
      const dpr = window.devicePixelRatio || 1;
      //const dpr = 2; // for testing purposes, set a fixed DPR value
      document.getElementById('dpr').textContent = dpr;
      
      document.getElementById('btn-locate').classList.add("dpr-" + dpr); // Add DPR class to the button
      document.getElementById('btn-kml').classList.add("dpr-" + dpr); // Add DPR class to the button

      var map = new maplibregl.Map({
         container: 'map',
         style: 'https://estasch.github.io/Reiterkarte/VectorMaps/PMTiles/bm_web_topandosm_wege_poi_01(8)_PMTiles_min_Vercel.json',
         center: [9.375844,48.498550],
         zoom: 13,
      });

      //map.showTileBoundaries = true;

      // ── Geolocate Control ──────────────────────────────────
      const geolocate = new maplibregl.GeolocateControl({
         positionOptions: { enableHighAccuracy: true },
         trackUserLocation: true,
         showUserHeading: true
      });
      map.addControl(geolocate);

      document.getElementById('btn-locate').addEventListener('click', () => {
         geolocate.trigger();
      });


      // ── Geolocate Control ──────────────────────────────────

      // ── KML laden ──────────────────────────────────────────
      document.getElementById('btn-kml').addEventListener('click', () => {
         document.getElementById('kml-file').click();
      });


      document.getElementById('kml-file').addEventListener('change', async (e) => {
         const file = e.target.files[0];
         if (!file) return;

         const text = await file.text();
         const xml = new DOMParser().parseFromString(text, 'application/xml');
         const placemarks = xml.querySelectorAll('Placemark');
         const features = [];

         placemarks.forEach(pm => {
         const name = pm.querySelector('name')?.textContent || '';

         const point = pm.querySelector('Point > coordinates');
         const line  = pm.querySelector('LineString > coordinates');
         const poly  = pm.querySelector('Polygon > outerBoundaryIs > LinearRing > coordinates');

         if (point) {
            const [lng, lat] = point.textContent.trim().split(',').map(Number);
            features.push({ type:'Feature', properties:{name}, geometry:{ type:'Point', coordinates:[lng,lat] } });
         }
         if (line) {
            const coords = line.textContent.trim().split(' ').map(c => c.split(',').map(Number));
            features.push({ type:'Feature', properties:{name}, geometry:{ type:'LineString', coordinates:coords } });
         }
         if (poly) {
            const coords = poly.textContent.trim().split(' ').map(c => c.split(',').map(Number));
            features.push({ type:'Feature', properties:{name}, geometry:{ type:'Polygon', coordinates:[coords] } });
         }
         });

         if (features.length === 0) {
         alert('Keine Placemarks gefunden. KML-Struktur prüfen.');
         return;
         }

         // Alte Daten entfernen
         ['kml-fill','kml-line','kml-point'].forEach(id => {
         if (map.getLayer(id)) map.removeLayer(id);
         });
         if (map.getSource('kml-data')) map.removeSource('kml-data');

         map.addSource('kml-data', { type:'geojson', data:{ type:'FeatureCollection', features } });

         map.addLayer({ id:'kml-fill',  type:'fill',   source:'kml-data', filter:['==','$type','Polygon'],    paint:{'fill-color':'#27ae60','fill-opacity':0.3} });
         map.addLayer({ id:'kml-line',  type:'line',   source:'kml-data', filter:['==','$type','LineString'], paint:{'line-color':'#2980b9','line-width':3} });
         map.addLayer({ id:'kml-point', type:'circle', source:'kml-data', filter:['==','$type','Point'],      paint:{'circle-radius':6,'circle-color':'#e74c3c'} });

         // Auf Daten zoomen
         try {
         const bounds = new maplibregl.LngLatBounds();
         features.forEach(f => {
            const b = new maplibregl.LngLatBounds(f.geometry.coordinates);
            bounds.extend(b);
         });
         if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 50 });
         
         } catch (error) {
         console.error('Fehler beim Berechnen der Bounds:', error);
         }
     

         // Popup bei Klick auf Punkte
         map.on('click', 'kml-point', (e) => {
         const name = e.features[0].properties.name;
         new maplibregl.Popup().setLngLat(e.lngLat).setText(name).addTo(map);
         });
         map.on('mouseenter', 'kml-point', () => map.getCanvas().style.cursor = 'pointer');
         map.on('mouseleave', 'kml-point', () => map.getCanvas().style.cursor = '');
      });
      // ── KML laden ──────────────────────────────────────────

      // Beispiel: Aktualisieren eines HTML-Elements mit der ID 'zoom-display'
      map.on('zoom', () => {
            document.getElementById('zoom-display').textContent = map.getZoom().toFixed(2);
      });

      map.on('style.load', () => {
        const layerSearchString = "poi_|text_|Name_";
        scaleTextOnLayersforHD(map,layerSearchString,dpr);      

      });

      if (isMobileDevice()) {
         console.log("Mobiles Ger�t erkannt");
      }

      function getScreenDimentions() {
         document.getElementById("dimenstions").innerHTML = 
         "Mobil Device: " + isMobileDevice() +"<br/>"+
         "Display Width : " + screen.width +"<br/> Display Height : " + screen.height;
      }
      
      function isMobileDevice() {
      // 1. Moderne L�sung: Client Hints API (Chromium-Browser)
      if (navigator.userAgentData) {
         console.log(navigator.userAgentData)
         return navigator.userAgentData.mobile;
      }
      
      // 2. Fallback: User-Agent Regex (f�r Safari, Firefox und �ltere Browser)
      console.log(navigator.userAgent)
      return /Mobi|Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      
   </script>
</body>

</html>
